name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # setup-python has builds of 3.8 and 3.9 only for images up to Ubuntu 24.04, which ubuntu-latest is at present.
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test
        run: python3 -I selftest.py
