name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # setup-python has builds of 3.8 and 3.9 only for images up to Ubuntu 24.04.
          - os: ubuntu-24.04
            python: "3.8"
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test
        run: python3 -I selftest.py
